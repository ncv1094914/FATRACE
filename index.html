<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Póker con amigos</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♠</text></svg>">
<style>:root {
  --bg: #0e1012;
  --panel: #16191c;
  --panel-2: #1d2125;
  --line: #2a2f34;
  --text: #e9ebee;
  --muted: #8b939b;
  --felt: #17392c;
  --felt-2: #102a20;
  --felt-line: #275441;
  --accent: #7fd6a3;
  --gold: #f0c96a;
  --red: #d8504d;
  --danger: #e06666;
  --card-w: 46px;
  --card-h: 64px;
  --radius: 10px;
}
* { box-sizing: border-box; }
html, body, #root { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
input, select { font: inherit; }

/* ---------- botones ---------- */
.btn {
  appearance: none; border: 1px solid var(--line); background: var(--panel-2);
  padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: 600;
  transition: background .15s, border-color .15s, transform .08s;
}
.btn:hover { background: #252a2f; border-color: #3a4147; }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: var(--text); color: #111; border-color: var(--text); }
.btn.primary:hover { background: #fff; }
.btn.ghost { background: transparent; }
.btn.small { padding: 6px 11px; font-size: 13px; }
.btn.big { padding: 14px 26px; font-size: 16px; }
.btn.danger { color: var(--danger); }

/* ---------- lobby ---------- */
.lobby { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; }
.lobby-card { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 14px; }
.lobby-card.center { align-items: center; text-align: center; color: var(--muted); }
.brand { text-align: center; margin-bottom: 10px; }
.brand .suits { letter-spacing: 8px; color: var(--muted); font-size: 18px; }
.brand .suits i { font-style: normal; color: var(--red); }
.brand h1 { font-size: 44px; margin: 6px 0 2px; letter-spacing: -1px; font-weight: 750; }
.brand p { margin: 0; color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.lobby input {
  background: var(--panel); border: 1px solid var(--line); color: var(--text);
  border-radius: 8px; padding: 11px 12px; outline: none; width: 100%;
}
.lobby input:focus { border-color: #4a535b; }
.join-row { display: flex; gap: 8px; }
.join-row input { text-transform: uppercase; letter-spacing: .3em; font-weight: 700; text-align: center; flex: 1; }
.or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.err { color: var(--danger); min-height: 1em; margin: 0; font-size: 13px; }
.hint { color: var(--muted); font-size: 12px; margin: 0; text-align: center; }
.spinner { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--text); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- barra superior ---------- */
body.is-table { overflow: hidden; }
.top {
  height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 14px;
  border-bottom: 1px solid var(--line); background: var(--bg);
}
.top.reconnecting { box-shadow: inset 0 -2px 0 var(--gold); }
.logo { font-weight: 750; letter-spacing: -.3px; }
.code { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; cursor: pointer; }
.code b { letter-spacing: .18em; margin: 0 2px; }
.code span { color: var(--muted); font-size: 12px; margin-left: 4px; }
.code:hover { border-color: #3a4147; }
.meta { display: flex; gap: 14px; color: var(--muted); }
.meta b { color: var(--text); font-weight: 600; }
.pill { color: var(--gold); }
.grow { flex: 1; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.ok { background: var(--accent); }
.dot.warn { background: var(--gold); animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .3; } }
.chat-toggle { display: none; }
.chat-toggle i { font-style: normal; color: var(--gold); }

/* ---------- distribución ---------- */
.layout { display: flex; height: calc(100% - 48px); }
.stage { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.chat { width: 280px; border-left: 1px solid var(--line); display: flex; flex-direction: column; background: var(--panel); }

/* ---------- mesa ---------- */
.table { position: relative; flex: 1; margin: 34px 70px 22px; min-height: 0; }
.felt {
  position: absolute; inset: 9% 7%; border-radius: 999px;
  background: radial-gradient(ellipse at 50% 40%, var(--felt) 0%, var(--felt-2) 75%);
  box-shadow: 0 0 0 10px #15181b, 0 0 0 11px var(--line), inset 0 0 60px rgba(0,0,0,.35);
}
.felt::after { content: ""; position: absolute; inset: 14px; border-radius: 999px; border: 1px solid var(--felt-line); opacity: .5; }
.center {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -54%);
  display: flex; flex-direction: column; align-items: center; gap: 10px; width: 60%;
}
.pot { min-height: 20px; color: #cfe3d8; font-size: 14px; }
.pot b { color: #fff; }
.board { display: flex; gap: 8px; }
.board .card { --card-w: 56px; --card-h: 78px; }
.msg { text-align: center; min-height: 40px; color: #dfe9e3; font-size: 14px; display: flex; flex-direction: column; gap: 3px; align-items: center; }
.msg small { color: var(--muted); text-transform: uppercase; font-size: 10px; letter-spacing: .08em; }
.msg .big-t { font-size: 17px; font-weight: 650; }
.msg .sub { color: #a8bbb1; font-size: 13px; }
.msg .next { color: #a8bbb1; font-size: 12px; margin-top: 2px; }
.msg > div:not(.next):not(.sub):not(.big-t) { animation: rise .35s ease-out both; }

/* ---------- cartas ---------- */
.card {
  width: var(--card-w); height: var(--card-h); border-radius: 6px; background: #f7f7f5; color: #16181a;
  display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1;
  box-shadow: 0 2px 6px rgba(0,0,0,.35); position: relative; flex: none; user-select: none;
}
.card .r { font-weight: 750; font-size: calc(var(--card-h) * .34); letter-spacing: -1px; }
.card .s { font-size: calc(var(--card-h) * .3); margin-top: 1px; }
.card.red { color: var(--red); }
.card.back {
  background: repeating-linear-gradient(45deg, #2a3036 0 4px, #23282d 4px 8px);
  border: 2px solid #3b434a;
}
.card.slot { background: transparent; box-shadow: none; border: 1px dashed rgba(255,255,255,.12); }
.card.win { box-shadow: 0 0 0 2px var(--gold), 0 4px 14px rgba(240,201,106,.35); }
.card.anim { animation: deal .38s cubic-bezier(.2,.8,.3,1) both; }
.board .card.anim { animation-name: flip; animation-duration: .45s; }
@keyframes deal { from { opacity: 0; transform: translateY(-26px) scale(.6) rotate(-8deg); } }
@keyframes flip { from { opacity: 0; transform: perspective(400px) rotateY(90deg) scale(.9); } }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }

/* ---------- asientos ---------- */
.seat { position: absolute; transform: translate(-50%, -50%); width: 124px; display: flex; flex-direction: column; align-items: center; transition: left .4s, top .4s; }
.seat .hole { display: flex; gap: 3px; height: 50px; align-items: flex-end; margin-bottom: -10px; z-index: 1; }
.seat .hole .card { --card-w: 36px; --card-h: 50px; }
.seat.me .hole { height: 66px; }
.seat.me .hole .card { --card-w: 48px; --card-h: 67px; }
.plate {
  position: relative; width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 13px 8px 6px; text-align: center; overflow: hidden; transition: border-color .2s, box-shadow .2s;
}
.plate .nm { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
.plate .nm .host { font-style: normal; color: var(--gold); margin-right: 3px; font-size: 11px; }
.plate .st { color: #cdd3d8; font-size: 13px; }
.muted { color: var(--muted); }
.timer { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,.06); }
.timer i { display: block; height: 100%; width: 100%; background: var(--accent); transition: width .25s linear; }
.timer i.low { background: var(--gold); }
.seat.turn .plate { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 18px rgba(127,214,163,.25); }
.seat.folded .hole, .seat.folded .plate { opacity: .45; }
.seat.out .plate { opacity: .6; }
.seat.offline .plate { border-style: dashed; }
.seat.winner .plate { border-color: var(--gold); animation: glow 1.1s ease-in-out 3; }
@keyframes glow { 50% { box-shadow: 0 0 0 1px var(--gold), 0 0 24px rgba(240,201,106,.45); } }
.last, .won, .hname {
  position: absolute; top: 100%; margin-top: 4px; font-size: 11px; padding: 2px 8px; border-radius: 99px;
  background: #0b0d0e; border: 1px solid var(--line); color: #cdd3d8; white-space: nowrap; animation: rise .25s ease-out both;
}
.last.allin { color: var(--gold); border-color: #5a4b25; }
.won { color: #111; background: var(--gold); border-color: var(--gold); font-weight: 700; }
.hname { top: auto; bottom: 100%; margin: 0 0 4px; color: var(--gold); }
.seat.me .hname { bottom: calc(100% + 0px); }
.bet {
  position: absolute; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 5px;
  font-size: 12px; font-weight: 650; color: #eaf3ee; background: rgba(0,0,0,.35); padding: 2px 8px 2px 3px; border-radius: 99px;
  animation: pop .25s ease-out both;
}
.chip { width: 14px; height: 14px; border-radius: 50%; background: var(--gold); box-shadow: inset 0 0 0 3px #c99b33, inset 0 0 0 4px #f6dd9a; display: inline-block; }
@keyframes pop { from { opacity: 0; transform: translate(-50%, -50%) scale(.5); } }
.dbtn {
  position: absolute; transform: translate(-50%, -50%); width: 22px; height: 22px; border-radius: 50%;
  background: #f4f4f2; color: #111; font-size: 11px; font-weight: 800; display: grid; place-items: center;
  box-shadow: 0 2px 4px rgba(0,0,0,.4); transition: left .4s, top .4s;
}

/* ---------- acciones ---------- */
.actions { min-height: 74px; border-top: 1px solid var(--line); display: flex; align-items: center; justify-content: center; padding: 10px 16px; }
.act-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 900px; }
.act-row.your-turn { animation: rise .2s ease-out both; }
.btn.act { min-width: 120px; padding: 12px 16px; font-size: 15px; }
.btn.act.fold:hover { border-color: var(--danger); color: var(--danger); }
.btn.act.call { background: #24302a; border-color: #2f5040; }
.btn.act.call:hover { background: #2a3a32; }
.btn.act.raisebtn { background: var(--text); color: #111; border-color: var(--text); min-width: 150px; }
.raise { display: flex; flex-direction: column; gap: 6px; }
.presets { display: flex; gap: 4px; }
.presets button { flex: 1; background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 3px 7px; font-size: 12px; color: var(--muted); cursor: pointer; }
.presets button:hover { color: var(--text); border-color: #3a4147; }
.raise-ctl { display: flex; gap: 8px; align-items: center; }
.raise-ctl input[type=range] { width: 170px; accent-color: var(--text); }
.raise-ctl input[type=number] { width: 80px; background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 6px; padding: 5px 7px; }
.wait-t { color: var(--muted); }

/* ---------- chat ---------- */
.chat-log { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 5px; }
.cm { font-size: 13px; word-wrap: break-word; animation: rise .2s ease-out both; }
.cm b { font-weight: 650; }
.cm.sys { color: var(--muted); font-size: 12px; }
.chat-form { display: flex; gap: 6px; padding: 10px; border-top: 1px solid var(--line); }
.chat-form input { flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 7px 9px; outline: none; }

/* ---------- modal anfitrión ---------- */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: center; z-index: 20; padding: 16px; }
.modal.hidden { display: none; }
.sheet { width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; animation: rise .2s ease-out both; }
.sheet-h { display: flex; align-items: center; justify-content: space-between; }
.sheet h2 { margin: 0; font-size: 18px; }
.sheet h3 { margin: 18px 0 8px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.x { background: none; border: 0; color: var(--muted); font-size: 16px; cursor: pointer; }
.sheet .row { display: flex; align-items: center; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
.note { color: var(--muted); font-size: 12px; margin: 0; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.grid label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.grid input, .grid select { background: var(--bg); border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 8px 9px; }
.pl { display: grid; grid-template-columns: 1fr 70px 1.3fr 64px; gap: 8px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); font-size: 13px; }
.pl .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- toast ---------- */
.toast {
  position: fixed; left: 50%; bottom: 92px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  background: var(--text); color: #111; padding: 9px 14px; border-radius: 8px; font-weight: 600; font-size: 13px;
  transition: opacity .2s, transform .2s; z-index: 30; max-width: 90vw; text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- pantallas chicas ---------- */
@media (max-height: 700px) {
  .table { margin-top: 26px; margin-bottom: 14px; }
  .seat .hole { height: 42px; }
  .seat .hole .card { --card-w: 30px; --card-h: 42px; }
  .seat.me .hole { height: 56px; }
  .seat.me .hole .card { --card-w: 40px; --card-h: 56px; }
  .board .card { --card-w: 48px; --card-h: 67px; }
  .plate { padding: 11px 6px 5px; }
  .actions { min-height: 64px; padding: 7px 12px; }
  .btn.act { padding: 10px 14px; }
}
@media (max-width: 1100px) {
  .chat-toggle { display: inline-block; }
  .chat { position: fixed; right: 0; top: 48px; bottom: 0; z-index: 10; transform: translateX(100%); transition: transform .2s; box-shadow: -10px 0 30px rgba(0,0,0,.4); }
  body.chat-open .chat { transform: none; }
  .table { margin-left: 56px; margin-right: 56px; }
  .meta span:nth-child(2) { display: none; }
}
@media (max-width: 760px) {
  .seat { width: 96px; }
  .plate .nm, .plate .st { font-size: 12px; }
  .code span, .logo { display: none; }
  .table { margin: 30px 46px 16px; }
  .board .card { --card-w: 40px; --card-h: 56px; }
  .btn.act { min-width: 90px; }
}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* ===== CONFIGURACIÓN =====
   Plan B (solo si la conexión normal no funciona en el colegio):
   pega aquí la URL de tu Firebase Realtime Database, por ejemplo:
   firebaseUrl: 'https://poker-noah-default-rtdb.firebaseio.com'          */
window.POKER_CONFIG = {
  firebaseUrl: ''
};
</script>

<script>/* Motor de Texas Hold'em No-Limit — puro y serializable (el estado es JSON). */
(function (root) {
  'use strict';

  const RANKS = '23456789TJQKA';
  const SUITS = 'shdc';
  const MAX_SEATS = 10;
  const DEFAULTS = { sb: 10, bb: 20, startStack: 1000, turnSeconds: 30 };
  const HAND_NAMES = ['Carta alta', 'Pareja', 'Doble pareja', 'Trío', 'Escalera', 'Color', 'Full', 'Póker', 'Escalera de color'];
  const DISCONNECTED_TURN_MS = 5000;
  const RUNOUT_MS = 1600;

  /* ---------- Cartas ---------- */
  function randInt(n) {
    const buf = new Uint32Array(1);
    const limit = Math.floor(0x100000000 / n) * n;
    let x;
    do { crypto.getRandomValues(buf); x = buf[0]; } while (x >= limit);
    return x % n;
  }
  function newDeck() {
    const d = [];
    for (const s of SUITS) for (const r of RANKS) d.push(r + s);
    for (let i = d.length - 1; i > 0; i--) { const j = randInt(i + 1); const t = d[i]; d[i] = d[j]; d[j] = t; }
    return d;
  }
  const rv = (c) => RANKS.indexOf(c[0]) + 2;

  function eval5(cards) {
    const vals = cards.map(rv).sort((a, b) => b - a);
    const flush = cards.every((c) => c[1] === cards[0][1]);
    let straight = 0;
    if (new Set(vals).size === 5) {

    const groups = Object.keys(cnt).map((v) => [cnt[v], +v]).sort((a, b) => b[0] - a[0] || b[1] - a[1]);
    const ord = groups.map((g) => g[1]);
    if (straight && flush) return [8, straight];
    if (groups[0][0] === 4) return [7].concat(ord);
    if (groups[0][0] === 3 && groups[1][0] === 2) return [6].concat(ord);
    if (flush) return [5].concat(vals);
    if (straight) return [4, straight];
    if (groups[0][0] === 3) return [3].concat(ord);
    if (groups[0][0] === 2 && groups[1][0] === 2) return [2].concat(ord);
    if (groups[0][0] === 2) return [1].concat(ord);
    return [0].concat(vals);
  }
  function cmpScore(a, b) {
    for (let i = 0; i < Math.max(a.length, b.length); i++) {
      const d = (a[i] || 0) - (b[i] || 0);
      if (d) return d;
    }
    return 0;
  }
  const PLURAL = { 14: 'Ases', 13: 'Reyes', 12: 'Damas', 11: 'Jotas' };
  const SING = { 14: 'As', 13: 'K', 12: 'Q', 11: 'J' };
  const pl = (v) => PLURAL[v] || String(v);
  const sg = (v) => SING[v] || String(v);
  function handName(s) {
    switch (s[0]) {
      case 8: return s[1] === 14 ? 'Escalera real' : 'Escalera de color al ' + sg(s[1]);
      case 7: return 'Póker de ' + pl(s[1]);
      case 6: return 'Full de ' + pl(s[1]) + ' con ' + pl(s[2]);
      case 5: return 'Color al ' + sg(s[1]);
      case 4: return 'Escalera al ' + sg(s[1]);
      case 3: return 'Trío de ' + pl(s[1]);
      case 2: return 'Doble pareja: ' + pl(s[1]) + ' y ' + pl(s[2]);
      case 1: return 'Pareja de ' + pl(s[1]);
      default: return 'Carta alta: ' + sg(s[1]);
    }
  }
  function bestHand(cards) {
    let best = null, combo = null;
    const n = cards.length;
    for (let a = 0; a < n - 4; a++) for (let b = a + 1; b < n - 3; b++) for (let c = b + 1; c < n - 2; c++)
      for (let d = c + 1; d < n - 1; d++) for (let e = d + 1; e < n; e++) {
        const cs = [cards[a], cards[b], cards[c], cards[d], cards[e]];
        const s = eval5(cs);
        if (!best || cmpScore(s, best) > 0) { best = s; combo = cs; }
      }
    return { score: best, cards: combo, name: handName(best) };
  }

  /* ---------- Mesa ---------- */
  function createGame(settings) {
    return {
      v: 1, settings: Object.assign({}, DEFAULTS, settings || {}), pending: null,
      seats: new Array(MAX_SEATS).fill(null), dealer: -1, handNo: 0, hand: null,
      running: false, paused: false, nextHandAt: 0, chat: [], chatId: 0, banned: [], result: null,
    };
  }
  const seatOf = (g, token) => g.seats.findIndex((s) => s && s.token === token);

  function sys(g, text) { pushChat(g, { sys: true, text }); }
  function pushChat(g, entry) {
    entry.id = ++g.chatId;
    g.chat.push(entry);
    if (g.chat.length > 80) g.chat.splice(0, g.chat.length - 80);
  }
  function addChat(g, seat, text) {
    const s = g.seats[seat];
    text = String(text || '').replace(/\s+/g, ' ').trim().slice(0, 200);
    if (!s || !text) return false;
    pushChat(g, { name: s.name, seat, text });
    return true;
  }

  function cleanName(name) {
    name = String(name || '').replace(/[<>]/g, '').replace(/\s+/g, ' ').trim().slice(0, 14);
    return name || 'Jugador';
  }
  function uniqueName(g, name) {
    const taken = new Set(g.seats.filter(Boolean).map((s) => s.name.toLowerCase()));
    if (!taken.has(name.toLowerCase())) return name;
    for (let i = 2; ; i++) if (!taken.has((name + i).toLowerCase())) return name + i;
  }

  function addPlayer(g, token, name, isHost) {
    if (g.banned.includes(token)) return { error: 'El anfitrión te sacó de esta mesa.' };
    let i = seatOf(g, token);
    if (i >= 0) {
      const s = g.seats[i];
      if (s.kicked) return { error: 'El anfitrión te sacó de esta mesa.' };
      if (!s.connected) { s.connected = true; sys(g, s.name + ' volvió'); }
      return { seat: i, rejoined: true };
    }
    i = g.seats.findIndex((s) => !s);
    if (i < 0) return { error: 'La mesa está llena (10 jugadores).' };
    const nm = uniqueName(g, cleanName(name));
    g.seats[i] = { token, name: nm, stack: g.settings.startStack, connected: true, sitOut: false, isHost: !!isHost, missed: 0, kicked: false, buyins: 1 };
    sys(g, nm + ' se sentó en la mesa');
    return { seat: i };
  }

  function handActive(g) { return !!(g.hand && g.hand.street !== 'done'); }

  function setConnected(g, token, val, now) {
    const i = seatOf(g, token);
    if (i < 0) return false;
    const s = g.seats[i];
    if (s.connected === val) return false;
    s.connected = val;
    if (!s.kicked) sys(g, s.name + (val ? ' volvió' : ' se desconectó'));
    const h = g.hand;
    if (!val && handActive(g) && h.turn === i) h.deadline = Math.min(h.deadline, now + DISCONNECTED_TURN_MS);
    return true;
  }

  function eligibleSeats(g) {
    const out = [];
    g.seats.forEach((s, i) => { if (s && !s.kicked && s.connected && !s.sitOut && s.stack > 0) out.push(i); });
    return out;
  }
  const canStart = (g) => eligibleSeats(g).length >= 2;

  function kick(g, seat, now) {
    const s = g.seats[seat];
    if (!s || s.isHost) return false;
    g.banned.push(s.token);
    sys(g, s.name + ' fue sacado de la mesa');
    const h = g.hand;
    if (handActive(g) && h.ps[seat] && !h.ps[seat].folded) {
      s.kicked = true;
      const p = h.ps[seat];
      p.folded = true; p.last = 'Fuera';
      const alive = h.order.filter((x) => !h.ps[x].folded);
      if (alive.length === 1) finishUncontested(g, alive[0], now);
      else if (h.turn === seat) advance(g, now, seat);
      else if (h.turn < 0 && !h.runoutAt) { /* nada */ }
    } else if (handActive(g) && h.ps[seat]) {
      s.kicked = true;
    } else {
      g.seats[seat] = null;
    }
    return true;
  }

  function setSitOut(g, seat, val) {
    const s = g.seats[seat];
    if (!s) return false;
    s.sitOut = !!val;
    s.missed = 0;
    return true;
  }

  function rebuy(g, seat) {
    const s = g.seats[seat];
    if (!s || s.stack > 0) return { error: 'Solo puedes recomprar cuando te quedas sin fichas.' };
    const h = g.hand;
    if (handActive(g) && h.ps[seat] && !h.ps[seat].folded) return { error: 'Espera a que termine la mano.' };
    s.stack = g.settings.startStack;
    s.buyins++;
    s.sitOut = false;
    sys(g, s.name + ' recompró ' + g.settings.startStack + ' fichas');
    return { ok: true };
  }

  /* ---------- Mano ---------- */
  function startHand(g, now) {
    if (g.pending) { Object.assign(g.settings, g.pending); g.pending = null; }
    const elig = eligibleSeats(g);
    if (elig.length < 2) return false;
    const dealer = elig.find((i) => i > g.dealer) ?? elig[0];
    g.dealer = dealer;
    g.handNo++;
    const di = elig.indexOf(dealer);
    const order = elig.slice(di + 1).concat(elig.slice(0, di + 1)); // empieza a la izquierda del botón
    const headsUp = elig.length === 2;
    const sb = headsUp ? dealer : order[0];
    const bb = headsUp ? order[0] : order[1];
    const deck = newDeck();
    const ps = {};
    for (const i of elig) ps[i] = { cards: [], bet: 0, total: 0, folded: false, allIn: false, acted: false, actedRaise: 0, last: '' };
    for (let r = 0; r < 2; r++) for (const i of order) ps[i].cards.push(deck.pop());
    const h = {
      deck, board: [], street: 'preflop', ps, order: elig.slice(), dealer, sb, bb,
      sbAmt: g.settings.sb, bbAmt: g.settings.bb,
      currentBet: 0, minRaise: g.settings.bb, raiseCounter: 1,
      turn: -1, deadline: 0, turnMs: 0, runoutAt: 0, reveal: false,
    };
    g.hand = h;
    g.result = null;
    g.nextHandAt = 0;
    post(g, sb, h.sbAmt, 'Ciega ' + h.sbAmt);
    post(g, bb, h.bbAmt, 'Ciega ' + h.bbAmt);
    h.currentBet = h.bbAmt;
    advance(g, now, bb);
    return true;
  }

  function post(g, seat, amt, label) {
    const s = g.seats[seat], p = g.hand.ps[seat];
    const a = Math.min(amt, s.stack);
    s.stack -= a; p.bet += a; p.total += a; p.last = label;
    if (s.stack === 0) { p.allIn = true; p.last = 'All-in'; }
  }

  function activeCount(h) { return h.order.filter((s) => !h.ps[s].folded && !h.ps[s].allIn).length; }
  function needsAction(h, s) {
    const p = h.ps[s];
    if (p.folded || p.allIn) return false;
    if (p.bet < h.currentBet) return true;
    if (!p.acted) return activeCount(h) > 1;
    return false;
  }
  function nextSeatToAct(h, from) {
    const ord = h.order, n = ord.length;
    let start = ord.findIndex((s) => s > from);
    if (start < 0) start = 0;
    for (let k = 0; k < n; k++) { const s = ord[(start + k) % n]; if (needsAction(h, s)) return s; }
    return -1;
  }

  function setTurn(g, seat, now) {
    const h = g.hand, s = g.seats[seat];
    h.turn = seat;
    h.turnMs = s.connected ? g.settings.turnSeconds * 1000 : DISCONNECTED_TURN_MS;
    h.deadline = now + h.turnMs;
  }

  function advance(g, now, from) {
    const h = g.hand;
    const alive = h.order.filter((s) => !h.ps[s].folded);
    if (alive.length === 1) return finishUncontested(g, alive[0], now);
    const nxt = nextSeatToAct(h, from);
    if (nxt >= 0) return setTurn(g, nxt, now);
    endStreet(g, now);
  }

  function returnUncalled(g) {
    const h = g.hand;
    const bets = h.order.map((s) => [s, h.ps[s].bet]).sort((a, b) => b[1] - a[1]);
    if (bets.length > 1 && bets[0][1] > bets[1][1]) {
      const diff = bets[0][1] - bets[1][1];
      const p = h.ps[bets[0][0]];
      p.bet -= diff; p.total -= diff;
      g.seats[bets[0][0]].stack += diff;
      if (p.allIn) { p.allIn = false; if (p.last === 'All-in') p.last = ''; }
    }
  }

  function dealStreet(h) {
    h.deck.pop(); // quemar
    if (h.street === 'preflop') { h.board.push(h.deck.pop(), h.deck.pop(), h.deck.pop()); h.street = 'flop'; }
    else if (h.street === 'flop') { h.board.push(h.deck.pop()); h.street = 'turn'; }
    else if (h.street === 'turn') { h.board.push(h.deck.pop()); h.street = 'river'; }
  }

  function endStreet(g, now) {
    const h = g.hand;
    returnUncalled(g);
    for (const s of h.order) {
      const p = h.ps[s];
      p.bet = 0; p.acted = false;
      if (!p.folded && !p.allIn) p.last = '';
    }
    h.currentBet = 0; h.minRaise = h.bbAmt; h.raiseCounter++;
    h.turn = -1;
    if (h.street === 'river') return showdown(g, now);
    if (activeCount(h) <= 1) { h.reveal = true; h.runoutAt = now + RUNOUT_MS; return; }
    dealStreet(h);
    setTurn(g, nextSeatToAct(h, h.dealer), now);
  }

  function legal(g, seat) {
    const h = g.hand, p = h.ps[seat], s = g.seats[seat];
    const toCall = Math.max(0, h.currentBet - p.bet);
    const othersActive = h.order.some((x) => x !== seat && !h.ps[x].folded && !h.ps[x].allIn);
    const maxTo = p.bet + s.stack;
    const canRaise = s.stack > toCall && othersActive && (!p.acted || p.actedRaise < h.raiseCounter);
    const minTo = Math.min(maxTo, h.currentBet + h.minRaise);
    return { toCall, callAmt: Math.min(toCall, s.stack), canCheck: toCall === 0, canRaise, minTo, maxTo, currentBet: h.currentBet };
  }

  function act(g, seat, type, amount, now, auto) {
    const h = g.hand;
    if (!handActive(g) || h.turn !== seat) return { error: 'No es tu turno.' };
    const p = h.ps[seat], s = g.seats[seat];
    const L = legal(g, seat);
    if (type === 'call' && L.toCall === 0) type = 'check';
    if (type === 'check' && L.toCall > 0) return { error: 'No puedes pasar, hay una apuesta.' };
    if (type === 'fold') { p.folded = true; p.last = 'Se retira'; }
    else if (type === 'check') { p.last = 'Pasa'; }
    else if (type === 'call') {
      const a = L.callAmt;
      s.stack -= a; p.bet += a; p.total += a;
      p.last = s.stack === 0 ? 'All-in' : 'Iguala';
    } else if (type === 'raise') {
      if (!L.canRaise) return { error: 'No puedes subir ahora.' };
      let to = Math.floor(Number(amount));
      if (!isFinite(to)) return { error: 'Cantidad inválida.' };
      if (to >= L.maxTo) to = L.maxTo;
      if (to < L.minTo) return { error: 'La subida mínima es a ' + L.minTo + '.' };
      if (to <= h.currentBet) return { error: 'Debes subir por encima de ' + h.currentBet + '.' };
      const put = to - p.bet;
      s.stack -= put; p.bet = to; p.total += put;
      const size = to - h.currentBet;
      const wasBet = h.currentBet === 0;
      if (size >= h.minRaise) { h.minRaise = size; h.raiseCounter++; }
      h.currentBet = to;
      p.last = s.stack === 0 ? 'All-in' : (wasBet ? 'Apuesta' : 'Sube');
    } else return { error: 'Acción desconocida.' };
    if (s.stack === 0 && !p.folded) p.allIn = true;
    p.acted = true;
    p.actedRaise = h.raiseCounter;
    if (!auto) s.missed = 0;
    advance(g, now, seat);
    return { ok: true };
  }

  function finishUncontested(g, w, now) {
    const h = g.hand;
    returnUncalled(g);
    let total = 0;
    for (const s of h.order) total += h.ps[s].total;
    g.seats[w].stack += total;
    g.result = { handNo: g.handNo, uncontested: true, pots: [{ amount: total, winners: [w], name: null, cards: [] }], winnings: { [w]: total } };
    sys(g, g.seats[w].name + ' gana ' + total);
    endHand(g, now, 3500);
  }

  function showdown(g, now) {
    const h = g.hand;
    const alive = h.order.filter((s) => !h.ps[s].folded);
    const ev = {};
    for (const s of alive) ev[s] = bestHand(h.ps[s].cards.concat(h.board));
    const contrib = h.order.map((s) => ({ s, amt: h.ps[s].total, folded: h.ps[s].folded }));
    const levels = [...new Set(contrib.map((c) => c.amt).filter((a) => a > 0))].sort((a, b) => a - b);
    const pots = [];
    let prev = 0;
    for (const L of levels) {
      let amount = 0;
      for (const c of contrib) amount += Math.min(c.amt, L) - Math.min(c.amt, prev);
      const elig = contrib.filter((c) => !c.folded && c.amt >= L).map((c) => c.s);
      const last = pots[pots.length - 1];
      if (!elig.length) { if (last) last.amount += amount; else pots.push({ amount, elig: alive.slice() }); }
      else if (last && last.elig.join() === elig.join()) last.amount += amount;
      else pots.push({ amount, elig });
      prev = L;
    }
    const leftOf = (s) => (s - h.dealer - 1 + MAX_SEATS) % MAX_SEATS;
    const winnings = {};
    const results = [];
    for (const pot of pots) {
      let best = null;
      for (const s of pot.elig) if (!best || cmpScore(ev[s].score, best) > 0) best = ev[s].score;
      const winners = pot.elig.filter((s) => cmpScore(ev[s].score, best) === 0).sort((a, b) => leftOf(a) - leftOf(b));
      const share = Math.floor(pot.amount / winners.length);
      let rem = pot.amount - share * winners.length;
      for (const w of winners) {
        const won = share + (rem > 0 ? 1 : 0); if (rem > 0) rem--;
        g.seats[w].stack += won;
        winnings[w] = (winnings[w] || 0) + won;
      }
      results.push({ amount: pot.amount, winners, name: ev[winners[0]].name, cards: ev[winners[0]].cards });
    }
    const shown = {};
    for (const s of alive) shown[s] = { name: ev[s].name };
    g.result = { handNo: g.handNo, uncontested: false, pots: results, winnings, shown };
    h.reveal = true;
    results.forEach((r, i) => {
      const names = r.winners.map((w) => g.seats[w].name).join(' y ');
      const label = results.length > 1 ? (i === 0 ? ' (bote principal)' : ' (bote lateral)') : '';
      sys(g, names + (r.winners.length > 1 ? ' se reparten ' : ' gana ') + r.amount + ' con ' + r.name + label);
    });
    endHand(g, now, 7000);
  }

  function endHand(g, now, delay) {
    const h = g.hand;
    h.street = 'done'; h.turn = -1; h.runoutAt = 0;
    g.nextHandAt = now + delay;
    g.seats.forEach((s, i) => { if (s && s.kicked) g.seats[i] = null; });
  }

  /* ---------- Reloj ---------- */
  function tick(g, now) {
    let changed = false;
    const h = g.hand;
    if (handActive(g)) {
      if (h.turn >= 0 && now >= h.deadline) {
        const seat = h.turn, s = g.seats[seat];
        const L = legal(g, seat);
        s.missed = (s.missed || 0) + 1;
        act(g, seat, L.toCall === 0 ? 'check' : 'fold', 0, now, true);
        if (s.missed >= 2 && s.connected && !s.sitOut) { s.sitOut = true; sys(g, s.name + ' está ausente'); }
        changed = true;
      } else if (h.turn < 0 && h.runoutAt && now >= h.runoutAt) {
        if (h.street === 'river') { h.runoutAt = 0; showdown(g, now); }
        else { dealStreet(h); h.runoutAt = now + RUNOUT_MS; }
        changed = true;
      }
    }
    if (!handActive(g) && g.running && !g.paused) {
      if (g.nextHandAt && now >= g.nextHandAt) {
        if (canStart(g)) startHand(g, now); else g.nextHandAt = 0;
        changed = true;
      } else if (!g.nextHandAt && canStart(g)) {
        g.nextHandAt = now + 3000; changed = true;
      }
    }
    return changed;
  }

  /* ---------- Vista por jugador ---------- */
  function view(g, token, now) {
    const you = seatOf(g, token);
    const h = g.hand;
    const active = handActive(g);
    const seats = g.seats.map((s, i) => {
      if (!s) return null;
      const p = h && h.ps[i];
      let cards = null;
      if (p) {
        if (i === you) cards = p.cards;
        else if (p.folded) cards = null;
        else if (h.reveal) cards = p.cards;
        else cards = ['??', '??'];
      }
      return {
        name: s.name, stack: s.stack, connected: s.connected, sitOut: s.sitOut, isHost: s.isHost,
        inHand: !!p, bet: p ? p.bet : 0, folded: p ? p.folded : false, allIn: p ? p.allIn : false,
        last: p ? p.last : '', cards,
      };
    });
    let pot = 0;
    if (h) for (const s of h.order) pot += h.ps[s].total - h.ps[s].bet;
    const yourTurn = active && you >= 0 && h.turn === you;
    return {
      you, isHost: you >= 0 && g.seats[you].isHost,
      settings: g.settings, pending: g.pending, running: g.running, paused: g.paused, handNo: g.handNo,
      active, seats, dealer: h ? h.dealer : g.dealer, sb: h ? h.sb : -1, bb: h ? h.bb : -1,
      board: h ? h.board : [], street: h ? h.street : null, pot,
      turn: active ? h.turn : -1, turnLeft: active && h.turn >= 0 ? Math.max(0, h.deadline - now) : 0, turnMs: h ? h.turnMs : 0,
      actions: yourTurn ? legal(g, you) : null,
      inThisHand: !!(h && you >= 0 && h.ps[you]),
      result: h && h.street === 'done' ? g.result : null,
      nextIn: !active && g.nextHandAt ? Math.max(0, g.nextHandAt - now) : 0,
      eligible: eligibleSeats(g).length,
      chat: g.chat.slice(-60),
    };
  }

  const api = {
    MAX_SEATS, DEFAULTS, createGame, addPlayer, setConnected, kick, setSitOut, rebuy, addChat, sys,
    startHand, act, tick, view, seatOf, canStart, handActive, legal, bestHand, cmpScore, eval5, newDeck,
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.Poker = api;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>/* Conexión: el anfitrión (host) tiene el juego; los demás se conectan a él.
   Tres "transportes" con la misma interfaz:
   - peer:     WebRTC con PeerJS (por defecto, sin configuración)
   - firebase: Firebase Realtime Database por REST (plan B si el colegio bloquea WebRTC)
   - local:    BroadcastChannel entre pestañas del mismo navegador (para pruebas)

   Host:    t.host(code, {onOpen, onMessage(clientId,msg), onLeave(clientId), onError(err)}) ; t.send(clientId,msg)
   Cliente: t.join(code, token, {onOpen, onMessage(msg), onClose, onError(err)}) ; t.send(msg) ; t.close()
*/
(function (root) {
  'use strict';
  const PREFIX = 'pokerhe-mesa-';

  /* ---------------- PeerJS ---------------- */
  function PeerTransport(extra) {
    const opts = () => Object.assign({ debug: 0 }, extra || {});
    let peer = null, conns = {}, conn = null, closed = false;
    return {
      name: 'peer',
      host(code, cb) {
        peer = new root.Peer(PREFIX + code.toLowerCase(), opts());
        peer.on('open', () => cb.onOpen && cb.onOpen());
        peer.on('connection', (c) => {
          c.on('open', () => { conns[c.peer] = c; });
          c.on('data', (d) => { conns[c.peer] = c; cb.onMessage(c.peer, d); });
          c.on('close', () => { if (conns[c.peer] === c) delete conns[c.peer]; cb.onLeave(c.peer); });
          c.on('error', () => {});
        });
        peer.on('disconnected', () => { if (!closed) setTimeout(() => { try { peer.reconnect(); } catch (e) {} }, 1500); });
        peer.on('error', (e) => {
          if (e.type === 'unavailable-id') cb.onError({ code: 'taken' });
          else if (e.type === 'peer-unavailable') { /* un cliente se fue */ }
          else if (['network', 'server-error', 'socket-error', 'socket-closed'].includes(e.type)) cb.onError({ code: 'network', detail: e.type });
          else if (e.type === 'browser-incompatible' || e.type === 'webrtc') cb.onError({ code: 'webrtc', detail: e.type });
        });
      },
      send(clientId, msg) { const c = conns[clientId]; if (c && c.open) { try { c.send(msg); } catch (e) {} } },
      join(code, token, cb) {
        closed = false;
        let opened = false;
        const timer = setTimeout(() => { if (!opened) cb.onError({ code: 'timeout' }); }, 15000);
        const connect = () => {
          conn = peer.connect(PREFIX + code.toLowerCase(), { reliable: true, serialization: 'json' });
          conn.on('open', () => { opened = true; clearTimeout(timer); cb.onOpen(); });
          conn.on('data', (d) => cb.onMessage(d));
          conn.on('close', () => { if (!closed) cb.onClose(); });
          conn.on('error', () => {});
        };
        if (peer && !peer.destroyed && peer.open) connect();
        else {
          if (peer) { try { peer.destroy(); } catch (e) {} }
          peer = new root.Peer(opts());
          peer.on('open', connect);
          peer.on('disconnected', () => { if (!closed) setTimeout(() => { try { peer.reconnect(); } catch (e) {} }, 1500); });
          peer.on('error', (e) => {
            clearTimeout(timer);
            if (e.type === 'peer-unavailable') cb.onError({ code: 'notfound' });
            else if (['network', 'server-error', 'socket-error', 'socket-closed'].includes(e.type)) cb.onError({ code: 'network', detail: e.type });
            else cb.onError({ code: 'other', detail: e.type });
          });
        }
        // la conexión del cliente usa JSON
      },
      sendToHost(msg) { if (conn && conn.open) { try { conn.send(msg); } catch (e) {} } },
      close() { closed = true; try { conn && conn.close(); } catch (e) {} },
      destroy() { closed = true; try { peer && peer.destroy(); } catch (e) {} peer = null; },
    };
  }

  /* ---------------- Firebase (REST + EventSource) ---------------- */
  function FirebaseTransport(base) {
    base = base.replace(/\/+$/, '');
    let es = null, code = null, token = null, closed = false;
    const url = (p) => base + '/rooms/' + code + p + '.json';
    const req = (p, method, body) => fetch(url(p), { method, body: body === undefined ? undefined : JSON.stringify(body) });
    let pendingDel = {}, delTimer = null;
    function scheduleDelete(key) {
      pendingDel[key] = null;
      if (!delTimer) delTimer = setTimeout(() => { const b = pendingDel; pendingDel = {}; delTimer = null; req('/inbox', 'PATCH', b).catch(() => {}); }, 1500);
    }
    function listen(path, onData, onFail) {
      const src = new EventSource(url(path));
      const handle = (ev) => { try { const d = JSON.parse(ev.data); onData(d.path, d.data); } catch (e) {} };
      src.addEventListener('put', handle);
      src.addEventListener('patch', handle);
      src.addEventListener('cancel', () => onFail && onFail({ code: 'denied' }));
      src.onerror = () => { if (src.readyState === 2 && !closed) onFail && onFail({ code: 'network' }); };
      return src;
    }
    return {
      name: 'firebase',
      host(c, cb) {
        code = c;
        const seen = new Set();
        const deliver = (key, val) => {
          if (!val || seen.has(key)) return;
          seen.add(key);
          scheduleDelete(key);
          if (val.from && val.m) cb.onMessage(val.from, val.m);
        };
        req('', 'PUT', { meta: { createdAt: Date.now() } })
          .then((r) => {
            if (!r.ok) throw new Error(r.status);
            es = listen('/inbox', (path, data) => {
              if (path === '/') { if (data) for (const k in data) deliver(k, data[k]); }
              else {
                const key = path.split('/')[1];
                if (path.split('/').length === 2) deliver(key, data);
              }
            }, cb.onError);
            cb.onOpen && cb.onOpen();
          })
          .catch(() => cb.onError({ code: 'network' }));
      },
      send(clientId, msg) { req('/views/' + clientId, 'PUT', msg).catch(() => {}); },
      join(c, tk, cb) {
        code = c; token = tk; closed = false;
        req('/meta', 'GET').then((r) => r.json()).then((meta) => {
          if (!meta) return cb.onError({ code: 'notfound' });
          req('/views/' + token, 'DELETE').catch(() => {}).then(() => {
            es = listen('/views/' + token, (path, data) => { if (path === '/' && data) cb.onMessage(data); }, () => { if (!closed) cb.onClose(); });
            cb.onOpen();
          });
        }).catch(() => cb.onError({ code: 'network' }));
      },
      sendToHost(msg) { req('/inbox', 'POST', { from: token, m: msg, ts: Date.now() }).catch(() => {}); },
      close() { closed = true; if (es) es.close(); es = null; },
      destroy() { this.close(); },
    };
  }

  /* ---------------- Local (pruebas) ---------------- */
  function LocalTransport() {
    let ch = null, id = 'c' + Math.random().toString(36).slice(2, 9), closed = false;
    return {
      name: 'local',
      host(code, cb) {
        ch = new BroadcastChannel('poker-' + code);
        ch.onmessage = (e) => { const d = e.data; if (d.to === 'host') cb.onMessage(d.from, d.m); };
        setTimeout(() => cb.onOpen && cb.onOpen(), 0);
      },
      send(clientId, msg) { ch.postMessage({ to: clientId, m: msg }); },
      join(code, token, cb) {
        closed = false;
        ch = new BroadcastChannel('poker-' + code);
        ch.onmessage = (e) => { if (!closed && e.data.to === id) cb.onMessage(e.data.m); };
        setTimeout(() => cb.onOpen(), 0);
      },
      sendToHost(msg) { if (!closed) ch.postMessage({ to: 'host', from: id, m: msg }); },
      close() { closed = true; },
      destroy() { closed = true; try { ch.close(); } catch (e) {} },
    };
  }

  root.PokerNet = {
    create(kind, opts) {
      if (kind === 'firebase') return FirebaseTransport(opts.firebaseUrl);
      if (kind === 'local') return LocalTransport();
      return PeerTransport(opts.peerOptions);
    },
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>/* Interfaz y lógica de anfitrión/cliente */
(function () {
  'use strict';
  const P = window.Poker;
  const CONFIG = window.POKER_CONFIG || {};
  const params = new URLSearchParams(location.search);
  const NET = params.get('red') || (CONFIG.firebaseUrl ? 'firebase' : 'peer');
  const ALPHA = 'ABCDEFGHJKLMNPQRSTUVWXYZ';

  /* ---------- utilidades ---------- */
  const $ = (s, el) => (el || document).querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = (n) => Number(n).toLocaleString('es-PE');
  const ls = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} },
  };
  function rid(n) { let s = ''; const a = new Uint32Array(n); crypto.getRandomValues(a); for (const x of a) s += 'abcdefghijkmnpqrstuvwxyz23456789'[x % 32]; return s; }
  const newCode = () => { let s = ''; const a = new Uint32Array(4); crypto.getRandomValues(a); for (const x of a) s += ALPHA[x % ALPHA.length]; return s; };
  const now = () => Date.now();

  // en modo de prueba local cada pestaña es un jugador distinto
  const TK = 'poker.token';
  let token = NET === 'local' ? sessionStorage.getItem(TK) : ls.get(TK);
  if (!token) { token = rid(16); if (NET === 'local') sessionStorage.setItem(TK, token); else ls.set(TK, token); }

  /* ---------- estado de la app ---------- */
  const app = {
    mode: 'lobby', code: null, view: null, net: null, status: 'off',
    // host
    g: null, clients: {}, byToken: {}, saveAt: 0,
    // cliente
    lastMsg: 0, lastSeq: 0, everConnected: false, retryTimer: null,
    // ui
    dealt: new Set(), dealtHand: -1, lastChatId: 0, actionKey: '', raiseTo: 0, localDeadline: 0, nextAt: 0,
    chatOpen: false, unread: 0,
  };

  /* =========================================================
     LOBBY
     ========================================================= */
  function showLobby(error) {
    app.mode = 'lobby';
    document.body.className = 'is-lobby';
    const saved = loadSaved();
    const codeParam = (params.get('sala') || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
    $('#root').innerHTML = `
      <main class="lobby">
        <div class="lobby-card">
          <div class="brand"><span class="suits">♠&#xFE0E; <i>♥&#xFE0E;</i> ♣&#xFE0E; <i>♦&#xFE0E;</i></span><h1>Póker</h1><p>Texas Hold'em con amigos</p></div>
          <label class="field"><span>Tu apodo</span>
            <input id="nick" maxlength="14" autocomplete="off" placeholder="Ej. Noah" value="${esc(ls.get('poker.name') || '')}"></label>
          <div class="join-row">
            <input id="code" maxlength="4" autocomplete="off" placeholder="CÓDIGO" value="${esc(codeParam)}" spellcheck="false">
            <button id="btnJoin" class="btn primary">Unirse</button>
          </div>
          <div class="or"><span>o</span></div>
          <button id="btnCreate" class="btn">Crear una mesa nueva</button>
          ${saved ? `<button id="btnResume" class="btn ghost">Reanudar mesa ${esc(saved.code)} · mano #${saved.g.handNo}</button>` : ''}
          <p id="lobbyErr" class="err">${error ? esc(error) : ''}</p>
          <p class="hint">Quien crea la mesa es el anfitrión: su pestaña debe quedarse abierta mientras juegan.</p>
        </div>
      </main>`;
    const nick = $('#nick'), code = $('#code');
    code.addEventListener('input', () => { code.value = code.value.toUpperCase().replace(/[^A-Z]/g, ''); });
    const getNick = () => {
      const n = nick.value.trim();
      if (!n) { $('#lobbyErr').textContent = 'Escribe tu apodo primero.'; nick.focus(); return null; }
      ls.set('poker.name', n); return n;
    };
    $('#btnJoin').onclick = () => {
      const n = getNick(); if (!n) return;
      if (code.value.length !== 4) { $('#lobbyErr').textContent = 'El código tiene 4 letras.'; code.focus(); return; }
      startClient(code.value, n);
    };
    code.addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#btnJoin').click(); });
    nick.addEventListener('keydown', (e) => { if (e.key === 'Enter') (code.value.length === 4 ? $('#btnJoin') : $('#btnCreate')).click(); });
    $('#btnCreate').onclick = () => { const n = getNick(); if (n) startHost(newCode(), P.createGame(), n, false); };
    if (saved) $('#btnResume').onclick = () => { const n = getNick(); if (n) startHost(saved.code, saved.g, n, true); };
    (codeParam ? nick : nick).focus();
  }

  function loadSaved() {
    try {
      const s = JSON.parse(ls.get('poker.host') || 'null');
      if (s && s.g && now() - s.savedAt < 6 * 3600 * 1000) return s;
    } catch (e) {}
    return null;
  }

  function connecting(text) {
    document.body.className = 'is-lobby';
    $('#root').innerHTML = `<main class="lobby"><div class="lobby-card center"><div class="spinner"></div><p>${esc(text)}</p>
      <button class="btn ghost" id="btnCancel">Cancelar</button></div></main>`;
    $('#btnCancel').onclick = () => leave();
  }

  function errorText(e, code) {
    switch (e.code) {
      case 'notfound': return `No existe una mesa con el código ${code}. Revisa el código o pídele al anfitrión que la cree de nuevo.`;
      case 'network': return 'No se pudo conectar con el servidor de conexión. Es posible que la red esté bloqueando el juego (ver plan B en las instrucciones).';
      case 'timeout': return 'Se encontró la mesa pero no se pudo conectar con el anfitrión. La red podría estar bloqueando conexiones directas entre computadoras (ver plan B).';
      case 'webrtc': return 'Este navegador no permite conexiones directas (WebRTC).';
      case 'denied': return 'Firebase rechazó la conexión. Revisa las reglas de la base de datos.';
      default: return 'Error de conexión (' + (e.detail || e.code) + ').';
    }
  }

  function leave() {
    if (app.net) { try { app.net.close(); app.net.destroy(); } catch (e) {} }
    clearInterval(app.loop); clearTimeout(app.retryTimer);
    if (app.mode === 'host') saveGame(true);
    app.net = null; app.g = null; app.view = null; app.clients = {}; app.byToken = {};
    history.replaceState(null, '', location.pathname + (NET !== 'peer' && params.get('red') ? '?red=' + NET : ''));
    showLobby();
  }

  /* =========================================================
     ANFITRIÓN
     ========================================================= */
  function startHost(code, g, nick, resume, attempt) {
    attempt = attempt || 0;
    app.mode = 'host'; app.code = code; app.g = g;
    connecting(resume ? 'Reabriendo la mesa ' + code + '…' : 'Creando la mesa…');
    const net = PokerNet.create(NET, CONFIG);
    app.net = net;
    net.host(code, {
      onOpen() {
        if (app.net !== net) return;
        const t = now();
        if (resume) {
          g.seats.forEach((s) => { if (s && s.token !== token) s.connected = false; });
          if (g.hand && g.hand.street !== 'done') { g.hand.deadline = t + (g.hand.turnMs || 30000); if (g.hand.runoutAt) g.hand.runoutAt = t + 1500; }
          if (g.nextHandAt) g.nextHandAt = t + 3000;
        }
        const r = P.addPlayer(g, token, nick, true);
        if (r.seat >= 0) g.seats[r.seat].isHost = true;
        app.status = 'ok';
        history.replaceState(null, '', location.pathname + '?sala=' + code + (params.get('red') ? '&red=' + NET : ''));
        buildTable();
        hostBroadcast();
        clearInterval(app.loop);
        app.loop = setInterval(hostLoop, 250);
      },
      onMessage(cid, msg) { if (app.net === net) hostMessage(cid, msg); },
      onLeave(cid) { if (app.net === net) hostClientGone(cid); },
      onError(e) {
        if (app.net !== net) return;
        if (e.code === 'taken') {
          try { net.destroy(); } catch (x) {}
          if (resume && attempt < 12) return setTimeout(() => startHost(code, g, nick, true, attempt + 1), 3000);
          if (!resume && attempt < 6) return startHost(newCode(), g, nick, false, attempt + 1);
          return showLobby('No se pudo reservar el código de la mesa. Intenta de nuevo en un minuto.');
        }
        if (app.status !== 'ok') { try { net.destroy(); } catch (x) {} app.net = null; showLobby(errorText(e, code)); }
        else { app.status = 'warn'; renderStatus(); }
      },
    });
  }

  function hostMessage(cid, msg) {
    if (!msg || typeof msg !== 'object') return;
    const g = app.g, t = now();
    const c = app.clients[cid] || (app.clients[cid] = { token: null, lastSeen: t });
    c.lastSeen = t;
    if (msg.t === 'join') {
      if (!msg.token || typeof msg.token !== 'string') return;
      if (msg.token === token) return app.net.send(cid, { t: 'error', msg: 'Ya estás en esta mesa en otra pestaña.' });
      const r = P.addPlayer(g, msg.token, msg.name, false);
      if (r.error) return app.net.send(cid, { t: 'error', msg: r.error });
      const old = app.byToken[msg.token];
      if (old && old !== cid) delete app.clients[old];
      c.token = msg.token; app.byToken[msg.token] = cid;
      P.setConnected(g, msg.token, true, t);
      app.net.send(cid, { t: 'pong' });
    } else if (msg.t === 'ping') {
      app.net.send(cid, { t: c.token ? 'pong' : 'rejoin' });
      return;
    } else {
      if (!c.token) return app.net.send(cid, { t: 'rejoin' });
      const seat = P.seatOf(g, c.token);
      if (seat < 0) return app.net.send(cid, { t: 'kicked' });
      const res = playerCommand(seat, msg, t);
      if (res && res.error) app.net.send(cid, { t: 'toast', msg: res.error });
    }
    P.tick(g, t);
    hostBroadcast();
  }

  function playerCommand(seat, msg, t) {
    const g = app.g;
    switch (msg.t) {
      case 'act': return P.act(g, seat, msg.type, msg.amount, t, false);
      case 'chat': P.addChat(g, seat, msg.text); return null;
      case 'rebuy': return P.rebuy(g, seat);
      case 'sitout': P.setSitOut(g, seat, msg.value); return null;
      case 'leave': { const s = g.seats[seat]; if (s) P.setConnected(g, s.token, false, t); return null; }
    }
    return null;
  }

  function hostClientGone(cid) {
    const c = app.clients[cid];
    if (!c) return;
    delete app.clients[cid];
    if (c.token && app.byToken[c.token] === cid) {
      delete app.byToken[c.token];
      P.setConnected(app.g, c.token, false, now());
      hostBroadcast();
    }
  }

  function hostLoop() {
    const t = now();
    for (const cid in app.clients) if (t - app.clients[cid].lastSeen > 12000) hostClientGone(cid);
    if (P.tick(app.g, t)) hostBroadcast();
    tickUI();
  }

  function hostBroadcast() {
    const g = app.g, t = now();
    app.lastSeq = Math.max(app.lastSeq + 1, t);
    for (const tk in app.byToken) {
      const cid = app.byToken[tk];
      app.net.send(cid, { t: 'state', seq: app.lastSeq, s: P.view(g, tk, t) });
    }
    render(P.view(g, token, t));
    saveGame(false);
  }

  function saveGame(force) {
    if (!app.g) return;
    const t = now();
    if (!force && t - app.saveAt < 1500) return;
    app.saveAt = t;
    ls.set('poker.host', JSON.stringify({ code: app.code, g: app.g, savedAt: t }));
  }

  // acciones locales del anfitrión como jugador / administrador
  function hostLocal(msg) {
    const g = app.g, t = now();
    const seat = P.seatOf(g, token);
    let res = null;
    if (msg.t === 'admin') res = adminCommand(msg, t);
    else if (seat >= 0) res = playerCommand(seat, msg, t);
    if (res && res.error) toast(res.error);
    P.tick(g, t);
    hostBroadcast();
  }

  function adminCommand(msg, t) {
    const g = app.g;
    switch (msg.cmd) {
      case 'start': g.running = true; g.paused = false; P.sys(g, 'Empieza la partida'); break;
      case 'pause': g.paused = true; P.sys(g, 'Partida en pausa (al terminar la mano)'); break;
      case 'resume': g.paused = false; g.running = true; P.sys(g, 'Se reanuda la partida'); break;
      case 'settings': {
        const sb = Math.max(1, Math.floor(msg.sb)), bb = Math.max(sb, Math.floor(msg.bb));
        const startStack = Math.max(bb * 5, Math.floor(msg.startStack));
        const turnSeconds = Math.max(10, Math.min(120, Math.floor(msg.turnSeconds)));
        if (!isFinite(sb) || !isFinite(bb) || !isFinite(startStack)) return { error: 'Valores inválidos.' };
        const ch = sb !== g.settings.sb || bb !== g.settings.bb;
        g.settings.startStack = startStack; g.settings.turnSeconds = turnSeconds;
        if (ch) {
          if (P.handActive(g)) { g.pending = { sb, bb }; P.sys(g, `Ciegas ${sb}/${bb} desde la próxima mano`); }
          else { g.settings.sb = sb; g.settings.bb = bb; P.sys(g, `Ciegas ahora ${sb}/${bb}`); }
        }
        break;
      }
      case 'kick': {
        const s = g.seats[msg.seat];
        if (!s || s.token === token) return null;
        const cid = app.byToken[s.token];
        P.kick(g, msg.seat, t);
        if (cid) { app.net.send(cid, { t: 'kicked' }); delete app.byToken[s.token]; delete app.clients[cid]; }
        break;
      }
    }
    return null;
  }

  /* =========================================================
     CLIENTE
     ========================================================= */
  function startClient(code, nick) {
    app.mode = 'client'; app.code = code; app.nick = nick;
    app.everConnected = false; app.lastSeq = 0;
    connecting('Conectando a la mesa ' + code + '…');
    clientConnect();
  }

  function clientConnect() {
    const code = app.code;
    if (app.net) { try { app.net.close(); } catch (e) {} }
    const net = app.net && app.net.name === NET ? app.net : PokerNet.create(NET, CONFIG);
    app.net = net;
    net.join(code, token, {
      onOpen() {
        app.lastMsg = now();
        net.sendToHost({ t: 'join', token, name: app.nick });
        clearInterval(app.loop);
        app.loop = setInterval(clientLoop, 250);
      },
      onMessage(m) { clientMessage(m); },
      onClose() { scheduleReconnect(); },
      onError(e) {
        if (app.everConnected) return scheduleReconnect();
        try { net.destroy(); } catch (x) {}
        app.net = null; clearInterval(app.loop);
        showLobby(errorText(e, code));
      },
    });
  }

  function scheduleReconnect() {
    if (app.mode !== 'client') return;
    app.status = 'warn'; renderStatus();
    clearTimeout(app.retryTimer);
    app.retryTimer = setTimeout(() => { if (app.mode === 'client') { app.lastMsg = now(); clientConnect(); } }, 2500);
  }

  function clientMessage(m) {
    if (!m || typeof m !== 'object') return;
    app.lastMsg = now();
    if (m.t === 'state') {
      if (m.seq && m.seq < app.lastSeq) return;
      app.lastSeq = m.seq || app.lastSeq;
      if (!app.everConnected) {
        app.everConnected = true;
        history.replaceState(null, '', location.pathname + '?sala=' + app.code + (params.get('red') ? '&red=' + NET : ''));
        buildTable();
      }
      app.status = 'ok';
      render(m.s);
    } else if (m.t === 'error') {
      try { app.net.close(); app.net.destroy(); } catch (e) {}
      app.net = null; clearInterval(app.loop); app.mode = 'lobby';
      showLobby(m.msg);
    } else if (m.t === 'kicked') {
      try { app.net.close(); app.net.destroy(); } catch (e) {}
      app.net = null; clearInterval(app.loop); app.mode = 'lobby';
      showLobby('El anfitrión te sacó de la mesa.');
    } else if (m.t === 'toast') toast(m.msg);
    else if (m.t === 'rejoin') app.net.sendToHost({ t: 'join', token, name: app.nick });
    else if (m.t === 'pong') { if (app.status !== 'ok' && app.everConnected) { app.status = 'ok'; renderStatus(); } }
  }

  function clientLoop() {
    const t = now();
    if (!app._lastPing || t - app._lastPing > 4000) { app._lastPing = t; app.net && app.net.sendToHost({ t: 'ping' }); }
    if (t - app.lastMsg > 12000 && app.status !== 'warn') scheduleReconnect();
    tickUI();
  }

  function send(msg) {
    if (app.mode === 'host') hostLocal(msg);
    else if (app.net) app.net.sendToHost(msg);
  }

  /* =========================================================
     MESA (UI)
     ========================================================= */
  function buildTable() {
    document.body.className = 'is-table';
    app.dealt = new Set(); app.dealtHand = -1; app.lastChatId = 0; app.actionKey = '';
    $('#root').innerHTML = `
      <header class="top">
        <div class="logo">♠ Póker</div>
        <button class="code" id="btnCopy" title="Copiar enlace de invitación">Mesa <b>${esc(app.code)}</b> <span>copiar enlace</span></button>
        <div class="meta" id="meta"></div>
        <div class="grow"></div>
        <span class="dot" id="dot" title="Conexión"></span>
        ${app.mode === 'host' ? '<button class="btn small" id="btnAdmin">Anfitrión</button>' : ''}
        <button class="btn small ghost chat-toggle" id="btnChat">Chat <i id="unread"></i></button>
        <button class="btn small ghost" id="btnLeave">Salir</button>
      </header>
      <div class="layout">
        <section class="stage">
          <div class="table" id="table">
            <div class="felt"></div>
            <div class="center">
              <div class="pot" id="pot"></div>
              <div class="board" id="board"></div>
              <div class="msg" id="msg"></div>
            </div>
            <div id="seats"></div>
          </div>
          <div class="actions" id="actions"></div>
        </section>
        <aside class="chat" id="chat">
          <div class="chat-log" id="chatLog"></div>
          <form class="chat-form" id="chatForm"><input id="chatIn" maxlength="200" autocomplete="off" placeholder="Escribe un mensaje…"><button class="btn small">Enviar</button></form>
        </aside>
      </div>
      <div class="modal hidden" id="modal"></div>
      <div class="toast" id="toast"></div>`;
    $('#btnCopy').onclick = () => {
      const link = location.origin + location.pathname + '?sala=' + app.code + (params.get('red') ? '&red=' + NET : '');
      const done = () => toast('Enlace copiado: ' + link);
      if (navigator.clipboard) navigator.clipboard.writeText(link).then(done, () => toast(link)); else toast(link);
    };
    $('#btnLeave').onclick = () => {
      const q = app.mode === 'host' ? '¿Cerrar la mesa? Los demás se desconectarán. Podrás reanudarla desde el inicio.' : '¿Salir de la mesa? Tu asiento se guarda si vuelves pronto.';
      if (confirm(q)) { if (app.mode === 'client') send({ t: 'leave' }); setTimeout(leave, 50); }
    };
    $('#btnChat').onclick = () => { app.chatOpen = !app.chatOpen; document.body.classList.toggle('chat-open', app.chatOpen); if (app.chatOpen) { app.unread = 0; renderUnread(); $('#chatIn').focus(); } };
    if (app.mode === 'host') $('#btnAdmin').onclick = openAdmin;
    $('#chatForm').onsubmit = (e) => { e.preventDefault(); const v = $('#chatIn').value.trim(); if (v) send({ t: 'chat', text: v }); $('#chatIn').value = ''; };
    document.onkeydown = onKey;
    window.onresize = () => app.view && renderSeats(app.view);
  }

  function onKey(e) {
    if (!app.view || !app.view.actions) return;
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' && e.target.id !== 'raiseIn') return;
    if (tag === 'input' && e.key !== 'Enter') return;
    const k = e.key.toLowerCase();
    if (e.key === 'Enter' && e.target.id === 'raiseIn') { e.preventDefault(); $('#bRaise') && $('#bRaise').click(); }
    else if (k === 'f') $('#bFold') && $('#bFold').click();
    else if (k === 'c' || k === 'p') $('#bCall') && $('#bCall').click();
  }

  function render(v) {
    app.view = v;
    if (!$('#table')) return;
    if (v.handNo !== app.dealtHand) { app.dealt = new Set(); app.dealtHand = v.handNo; }
    app.localDeadline = v.turn >= 0 ? now() + v.turnLeft : 0;
    app.nextAt = v.nextIn ? now() + v.nextIn : 0;
    renderMeta(v); renderStatus(); renderSeats(v); renderCenter(v); renderActions(v); renderChat(v);
    if (!$('#modal').classList.contains('hidden') && app.mode === 'host') renderAdmin();
  }

  function renderMeta(v) {
    const s = v.settings;
    $('#meta').innerHTML = `<span>Ciegas <b>${fmt(s.sb)}/${fmt(s.bb)}</b></span>${v.handNo ? `<span>Mano <b>#${v.handNo}</b></span>` : ''}${v.paused ? '<span class="pill">En pausa</span>' : ''}`;
  }
  function renderStatus() {
    const d = $('#dot'); if (!d) return;
    d.className = 'dot ' + (app.status === 'ok' ? 'ok' : 'warn');
    d.title = app.status === 'ok' ? 'Conectado' : 'Reconectando…';
    const tb = $('.top'); if (tb) tb.classList.toggle('reconnecting', app.status !== 'ok');
  }

  /* ---------- cartas ---------- */
  const SUIT = { s: '♠\uFE0E', h: '♥\uFE0E', d: '♦\uFE0E', c: '♣\uFE0E' };
  function cardHTML(c, key, extra) {
    let anim = '';
    if (key && !app.dealt.has(key)) { app.dealt.add(key); anim = ' anim'; }
    if (!c || c === '??') return `<div class="card back${anim}${extra || ''}"></div>`;
    const r = c[0] === 'T' ? '10' : c[0];
    const red = c[1] === 'h' || c[1] === 'd';
    return `<div class="card${red ? ' red' : ''}${anim}${extra || ''}"><span class="r">${r}</span><span class="s">${SUIT[c[1]]}</span></div>`;
  }

  function seatLayout(v) {
    const occ = [];
    v.seats.forEach((s, i) => { if (s) occ.push(i); });
    const me = v.you >= 0 ? occ.indexOf(v.you) : -1;
    const ordered = me >= 0 ? occ.slice(me).concat(occ.slice(0, me)) : occ;
    const n = ordered.length, pos = {};
    ordered.forEach((seat, j) => {
      const a = (90 + (j * 360) / Math.max(n, 1)) * Math.PI / 180;
      const cx = Math.cos(a), cy = Math.sin(a);
      const d = a - 0.32; // el botón del dealer va a un costado del asiento
      pos[seat] = {
        x: 50 + 43 * cx, y: 50 + 39 * cy,
        bx: 50 + 29 * cx, by: 50 + 19 * cy,
        dx: 50 + 33 * Math.cos(d), dy: 50 + 29 * Math.sin(d),
      };
    });
    return pos;
  }

  function renderSeats(v) {
    const pos = seatLayout(v);
    const res = v.result;
    const winCards = new Set();
    const winners = new Set();
    if (res) { res.pots.forEach((p) => p.winners.forEach((w) => winners.add(w))); if (!res.uncontested && res.pots[0]) res.pots[0].cards.forEach((c) => winCards.add(c)); }
    let html = '';
    v.seats.forEach((s, i) => {
      if (!s) return;
      const p = pos[i];
      const me = i === v.you;
      const cls = ['seat'];
      if (me) cls.push('me');
      if (v.turn === i) cls.push('turn');
      if (s.inHand && s.folded) cls.push('folded');
      if (!s.inHand) cls.push('out');
      if (!s.connected) cls.push('offline');
      if (winners.has(i)) cls.push('winner');
      let cards = '';
      if (s.cards) cards = s.cards.map((c, k) => cardHTML(c, `${v.handNo}:${i}:${k}:${c === '??' ? 'b' : 'f'}`, winCards.has(c) ? ' win' : '')).join('');
      let status = '';
      if (!s.connected) status = 'Desconectado';
      else if (s.sitOut) status = 'Ausente';
      else if (s.stack === 0 && !s.inHand) status = 'Sin fichas';
      else if (!s.inHand && v.active) status = 'Espera';
      const won = res && res.winnings[i] ? `<div class="won">+${fmt(res.winnings[i])}</div>` : '';
      const hn = res && res.shown && res.shown[i] && !s.folded ? `<div class="hname">${esc(res.shown[i].name)}</div>` : '';
      const last = s.last && !won ? `<div class="last ${s.last === 'All-in' ? 'allin' : ''}">${esc(s.last)}</div>` : '';
      html += `<div class="${cls.join(' ')}" style="left:${p.x}%;top:${p.y}%">
          <div class="hole">${cards}</div>
          <div class="plate">
            <div class="nm">${s.isHost ? '<i class="host" title="Anfitrión">★</i>' : ''}${esc(s.name)}</div>
            <div class="st">${status ? `<span class="muted">${status}</span>` : fmt(s.stack)}</div>
            ${v.turn === i ? '<div class="timer"><i></i></div>' : ''}
          </div>
          ${won || last}${hn}
        </div>`;
      if (s.bet > 0) html += `<div class="bet" style="left:${p.bx}%;top:${p.by}%"><i class="chip"></i>${fmt(s.bet)}</div>`;
      if (v.dealer === i && v.handNo) html += `<div class="dbtn" style="left:${p.dx}%;top:${p.dy}%">D</div>`;
    });
    $('#seats').innerHTML = html;
    tickUI();
  }

  function renderCenter(v) {
    const res = v.result;
    const winCards = new Set();
    if (res && !res.uncontested && res.pots[0]) res.pots[0].cards.forEach((c) => winCards.add(c));
    const board = [];
    for (let k = 0; k < 5; k++) {
      const c = v.board[k];
      board.push(c ? cardHTML(c, v.handNo + ':b' + k, winCards.has(c) ? ' win' : '') : '<div class="card slot"></div>');
    }
    $('#board').innerHTML = board.join('');
    // escalonar el flop
    $('#board').querySelectorAll('.card.anim').forEach((el, idx) => { el.style.animationDelay = idx * 110 + 'ms'; });
    const bets = v.seats.reduce((a, s) => a + (s ? s.bet : 0), 0);
    $('#pot').innerHTML = v.handNo && v.active && (v.pot || bets) ? `Bote <b>${fmt(v.pot + bets)}</b>` : '';
    let msg = '';
    if (res) {
      msg = res.pots.map((p, i) => {
        const names = p.winners.map((w) => esc(v.seats[w] ? v.seats[w].name : '?')).join(' y ');
        const lbl = res.pots.length > 1 ? `<small>${i === 0 ? 'Bote principal' : 'Bote lateral'}</small> ` : '';
        return `<div>${lbl}<b>${names}</b> ${p.winners.length > 1 ? 'se reparten' : 'gana'} ${fmt(p.amount)}${p.name && !res.uncontested ? ' · ' + esc(p.name) : ''}</div>`;
      }).join('') + `<div class="next" id="nextIn"></div>`;
    } else if (!v.active) {
      if (!v.running) {
        if (v.isHost) msg = v.eligible >= 2
          ? `<button class="btn primary big" id="btnStart">Empezar partida</button><div class="sub">${v.eligible} jugadores en la mesa</div>`
          : `<div class="big-t">Esperando jugadores…</div><div class="sub">Comparte el código <b>${esc(app.code)}</b> con tus amigos</div>`;
        else msg = `<div class="big-t">Esperando al anfitrión</div><div class="sub">La partida empieza cuando el anfitrión lo indique</div>`;
      } else if (v.paused) msg = `<div class="big-t">Partida en pausa</div>`;
      else if (v.eligible < 2) msg = `<div class="big-t">Esperando jugadores…</div><div class="sub">Se necesitan al menos 2 con fichas</div>`;
      else msg = `<div class="next" id="nextIn"></div>`;
    }
    $('#msg').innerHTML = msg;
    const bs = $('#btnStart'); if (bs) bs.onclick = () => send({ t: 'admin', cmd: 'start' });
  }

  function renderActions(v) {
    const el = $('#actions');
    const me = v.you >= 0 ? v.seats[v.you] : null;
    const A = v.actions;
    const key = A ? ['turn', v.handNo, v.street, A.currentBet, A.toCall, A.maxTo, A.canRaise].join('|')
      : ['wait', v.handNo, me && me.stack, me && me.sitOut, v.inThisHand, me && me.folded, v.active, v.turn].join('|');
    if (key === app.actionKey) return;
    app.actionKey = key;
    if (!me) { el.innerHTML = ''; return; }
    if (A) {
      const bets = v.seats.reduce((a, s) => a + (s ? s.bet : 0), 0);
      const potAll = v.pot + bets;
      const raiseFor = (f) => Math.round(A.currentBet + f * (potAll + A.toCall));
      const clamp = (x) => Math.max(A.minTo, Math.min(A.maxTo, x));
      app.raiseTo = A.minTo;
      const verb = A.currentBet === 0 ? 'Apostar' : 'Subir a';
      el.innerHTML = `
        <div class="act-row your-turn">
          <button class="btn act fold" id="bFold">Retirarse</button>
          <button class="btn act call" id="bCall">${A.canCheck ? 'Pasar' : (A.callAmt === me.stack ? 'All-in ' : 'Igualar ') + fmt(A.callAmt)}</button>
          ${A.canRaise ? `
          <div class="raise">
            <div class="presets">
              <button data-to="${clamp(A.minTo)}">Mín</button>
              <button data-to="${clamp(raiseFor(0.5))}">½ bote</button>
              <button data-to="${clamp(raiseFor(1))}">Bote</button>
              <button data-to="${A.maxTo}">All-in</button>
            </div>
            <div class="raise-ctl">
              <input type="range" id="raiseRange" min="${A.minTo}" max="${A.maxTo}" step="1" value="${A.minTo}">
              <input type="number" id="raiseIn" min="${A.minTo}" max="${A.maxTo}" value="${A.minTo}">
            </div>
          </div>
          <button class="btn act raisebtn" id="bRaise"></button>` : ''}
        </div>`;
      const upd = (x, fromInput) => {
        x = Math.floor(Number(x)); if (!isFinite(x)) x = A.minTo;
        app.raiseTo = clamp(x);
        const r = $('#raiseRange'), i = $('#raiseIn'), b = $('#bRaise');
        if (r) r.value = app.raiseTo;
        if (i && !fromInput) i.value = app.raiseTo;
        if (b) b.textContent = app.raiseTo >= A.maxTo ? 'All-in ' + fmt(A.maxTo) : verb + ' ' + fmt(app.raiseTo);
      };
      $('#bFold').onclick = () => send({ t: 'act', type: 'fold' });
      $('#bCall').onclick = () => send({ t: 'act', type: A.canCheck ? 'check' : 'call' });
      if (A.canRaise) {
        upd(A.minTo);
        $('#raiseRange').oninput = (e) => upd(e.target.value);
        $('#raiseIn').oninput = (e) => upd(e.target.value, true);
        $('#raiseIn').onblur = () => upd($('#raiseIn').value);
        el.querySelectorAll('.presets button').forEach((b) => (b.onclick = () => upd(b.dataset.to)));
        $('#bRaise').onclick = () => send({ t: 'act', type: 'raise', amount: app.raiseTo });
      }
      return;
    }
    let text = '', btns = '';
    if (me.stack === 0 && !(v.active && v.inThisHand && !me.folded)) {
      text = 'Te quedaste sin fichas.';
      btns = `<button class="btn primary" id="bRebuy">Recomprar ${fmt(v.settings.startStack)}</button>`;
    } else if (me.sitOut) {
      text = 'Estás ausente: no recibirás cartas.';
      btns = `<button class="btn primary" id="bBack">Volver a jugar</button>`;
    } else {
      if (v.active && v.inThisHand && !me.folded) text = v.turn >= 0 && v.seats[v.turn] ? `Turno de ${esc(v.seats[v.turn].name)}` : 'Repartiendo…';
      else if (v.active && me.folded) text = 'Te retiraste de esta mano.';
      else if (v.active) text = 'Entras en la próxima mano.';
      else text = '';
      btns = `<button class="btn ghost small" id="bSit">Sentarme fuera</button>`;
    }
    el.innerHTML = `<div class="act-row waiting"><span class="wait-t">${text}</span>${btns}</div>`;
    const r = $('#bRebuy'); if (r) r.onclick = () => send({ t: 'rebuy' });
    const b = $('#bBack'); if (b) b.onclick = () => send({ t: 'sitout', value: false });
    const s = $('#bSit'); if (s) s.onclick = () => send({ t: 'sitout', value: true });
  }

  function renderChat(v) {
    const log = $('#chatLog');
    const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
    let added = 0;
    for (const m of v.chat) {
      if (m.id <= app.lastChatId) continue;
      app.lastChatId = m.id;
      const d = document.createElement('div');
      d.className = m.sys ? 'cm sys' : 'cm';
      d.innerHTML = m.sys ? esc(m.text) : `<b>${esc(m.name)}</b> ${esc(m.text)}`;
      log.appendChild(d);
      if (!m.sys) added++;
    }
    while (log.children.length > 120) log.removeChild(log.firstChild);
    if (atBottom || added) log.scrollTop = log.scrollHeight;
    if (added && !app.chatOpen && getComputedStyle($('#btnChat')).display !== 'none') { app.unread += added; renderUnread(); }
  }
  function renderUnread() { const u = $('#unread'); if (u) u.textContent = app.unread ? app.unread : ''; }

  function tickUI() {
    const v = app.view; if (!v) return;
    const bar = $('.seat.turn .timer i');
    if (bar && app.localDeadline) {
      const left = Math.max(0, app.localDeadline - now());
      const f = v.turnMs ? left / v.turnMs : 0;
      bar.style.width = (f * 100).toFixed(1) + '%';
      bar.classList.toggle('low', left < 8000);
    }
    const n = $('#nextIn');
    if (n) {
      const left = app.nextAt ? Math.ceil((app.nextAt - now()) / 1000) : 0;
      n.textContent = v.running && !v.paused && left > 0 ? 'Siguiente mano en ' + left + '…' : (v.paused ? 'Partida en pausa' : '');
    }
  }

  /* ---------- panel del anfitrión ---------- */
  function openAdmin() { $('#modal').classList.remove('hidden'); renderAdmin(true); }
  function renderAdmin(first) {
    const m = $('#modal'), g = app.g, s = g.settings;
    if (!first && m.contains(document.activeElement) && document.activeElement.tagName === 'INPUT') {
      // no reescribir mientras escribe; solo la lista
      const list = $('#plist'); if (list) list.innerHTML = playersList(); bindKicks(); return;
    }
    const pend = g.pending ? `<p class="note">Pendiente: ciegas ${g.pending.sb}/${g.pending.bb} en la próxima mano.</p>` : '';
    m.innerHTML = `<div class="sheet">
      <div class="sheet-h"><h2>Mesa ${esc(app.code)}</h2><button class="x" id="mClose">✕</button></div>
      <div class="row">
        ${!g.running ? `<button class="btn primary" id="aStart" ${P.canStart(g) ? '' : 'disabled'}>Empezar partida</button>`
          : g.paused ? '<button class="btn primary" id="aResume">Reanudar</button>' : '<button class="btn" id="aPause">Pausar</button>'}
        <span class="note">${g.running ? (g.paused ? 'No se repartirán más manos.' : 'La pausa espera a que termine la mano.') : 'Necesitas al menos 2 jugadores.'}</span>
      </div>
      <div class="grid">
        <label>Ciega pequeña<input type="number" id="aSb" value="${(g.pending || s).sb}" min="1"></label>
        <label>Ciega grande<input type="number" id="aBb" value="${(g.pending || s).bb}" min="1"></label>
        <label>Fichas iniciales / recompra<input type="number" id="aStack" value="${s.startStack}" min="50"></label>
        <label>Segundos por turno<select id="aTime">${[15, 20, 30, 45, 60].map((x) => `<option ${x === s.turnSeconds ? 'selected' : ''}>${x}</option>`).join('')}</select></label>
      </div>
      <div class="row"><button class="btn" id="aSave">Guardar ajustes</button>${pend}</div>
      <h3>Jugadores</h3>
      <div id="plist">${playersList()}</div>
    </div>`;
    $('#mClose').onclick = () => m.classList.add('hidden');
    m.onclick = (e) => { if (e.target === m) m.classList.add('hidden'); };
    const b = (id, cmd) => { const e = $('#' + id); if (e) e.onclick = () => send({ t: 'admin', cmd }); };
    b('aStart', 'start'); b('aPause', 'pause'); b('aResume', 'resume');
    $('#aSave').onclick = () => {
      send({ t: 'admin', cmd: 'settings', sb: +$('#aSb').value, bb: +$('#aBb').value, startStack: +$('#aStack').value, turnSeconds: +$('#aTime').value });
      toast('Ajustes guardados'); renderAdmin(true);
    };
    bindKicks();
  }
  function playersList() {
    const g = app.g;
    return g.seats.map((s, i) => s ? `<div class="pl"><span class="nm">${s.isHost ? '★ ' : ''}${esc(s.name)}</span><span>${fmt(s.stack)}</span>
      <span class="muted">${!s.connected ? 'desconectado' : s.sitOut ? 'ausente' : 'en la mesa'}${s.buyins > 1 ? ' · ' + (s.buyins - 1) + ' recompra' + (s.buyins > 2 ? 's' : '') : ''}</span>
      ${s.token !== token ? `<button class="btn small ghost danger" data-kick="${i}">Sacar</button>` : '<span></span>'}</div>` : '').join('');
  }
  function bindKicks() {
    document.querySelectorAll('[data-kick]').forEach((b) => (b.onclick = () => {
      const s = app.g.seats[+b.dataset.kick];
      if (s && confirm('¿Sacar a ' + s.name + ' de la mesa?')) send({ t: 'admin', cmd: 'kick', seat: +b.dataset.kick });
    }));
  }

  let toastT = 0;
  function toast(text) {
    const t = $('#toast'); if (!t) return alert(text);
    t.textContent = text; t.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3200);
  }

  window.addEventListener('beforeunload', (e) => {
    if (app.mode === 'host') { saveGame(true); e.preventDefault(); e.returnValue = ''; }
  });

  // pruebas automáticas
  window.__poker = { app, send };

  showLobby();
})();
</script>
</body>
</html>
